apply plugin: 'com.android.application'

android {
    // NOTE: namespace 必須與 :app 不同（AGP 8 不允許重複），
    // 但 applicationId 必須與 :app 完全相同，Wearable Data Layer 才會把兩者視為同一組 App。
    namespace "com.twsa.scoreboard.wear"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.twsa.scoreboard"
        minSdkVersion 28
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.sbVersionCode
        versionName rootProject.ext.sbVersionName
    }

    // ── 簽章 ──
    // 必須與 :app 用同一把金鑰，否則手錶與手機不會互相認得（且不會有明顯錯誤訊息）。
    signingConfigs {
        debug {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "scoreboard-wear-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear:wear:1.3.0'
}
